[package]
name = "injection-verification-tool"
version = "1.0.0"
description = "Injection Verification Tool (DIMA) - Desktop"
authors = ["DIMA"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "process-relaunch", "shell-open", "dialog-all", "path-all", "process-exit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 경량 임베디드 HTTP 서버 (C# HttpListener 대체용)
tiny_http = "0.12"

[features]
# Tauri 기본: 프로덕션 빌드에서 custom-protocol 사용
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
